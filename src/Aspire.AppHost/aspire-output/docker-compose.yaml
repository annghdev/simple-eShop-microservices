services:
  eshop-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  redis:
    image: "docker.io/library/redis:8.2"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD"
    entrypoint:
      - "/bin/sh"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    expose:
      - "6379"
    networks:
      - "aspire"
  rabbitmq:
    image: "docker.io/library/rabbitmq:4.2-management"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    expose:
      - "5672"
      - "15672"
      - "15692"
    networks:
      - "aspire"
  postgres:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    networks:
      - "aspire"
  catalog:
    image: "${CATALOG_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${CATALOG_PORT}"
      ConnectionStrings__catalogdb: "Host=postgres;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=catalogdb"
      CATALOGDB_HOST: "postgres"
      CATALOGDB_PORT: "5432"
      CATALOGDB_USERNAME: "${POSTGRES_USER}"
      CATALOGDB_PASSWORD: "${POSTGRES_PASSWORD}"
      CATALOGDB_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalogdb"
      CATALOGDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/catalogdb"
      CATALOGDB_DATABASENAME: "catalogdb"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      JAEGER_OTLP_ENDPOINT: "http://localhost:4317"
      TEMPO_OTLP_ENDPOINT: "http://localhost:4319"
      LOKI_ENDPOINT: "http://localhost:3100"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://eshop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "catalog"
    expose:
      - "${CATALOG_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
      redis:
        condition: "service_started"
      rabbitmq:
        condition: "service_started"
    networks:
      - "aspire"
  inventory:
    image: "${INVENTORY_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${INVENTORY_PORT}"
      JAEGER_OTLP_ENDPOINT: "http://localhost:4317"
      TEMPO_OTLP_ENDPOINT: "http://localhost:4319"
      LOKI_ENDPOINT: "http://localhost:3100"
      ConnectionStrings__inventorydb: "Host=postgres;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=inventorydb"
      INVENTORYDB_HOST: "postgres"
      INVENTORYDB_PORT: "5432"
      INVENTORYDB_USERNAME: "${POSTGRES_USER}"
      INVENTORYDB_PASSWORD: "${POSTGRES_PASSWORD}"
      INVENTORYDB_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inventorydb"
      INVENTORYDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/inventorydb"
      INVENTORYDB_DATABASENAME: "inventorydb"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://eshop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "inventory"
    expose:
      - "${INVENTORY_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
      rabbitmq:
        condition: "service_started"
      redis:
        condition: "service_started"
    networks:
      - "aspire"
  order:
    image: "${ORDER_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${ORDER_PORT}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__orderdb: "Host=postgres;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=orderdb"
      ORDERDB_HOST: "postgres"
      ORDERDB_PORT: "5432"
      ORDERDB_USERNAME: "${POSTGRES_USER}"
      ORDERDB_PASSWORD: "${POSTGRES_PASSWORD}"
      ORDERDB_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orderdb"
      ORDERDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/orderdb"
      ORDERDB_DATABASENAME: "orderdb"
      JAEGER_OTLP_ENDPOINT: "http://localhost:4317"
      TEMPO_OTLP_ENDPOINT: "http://localhost:4319"
      LOKI_ENDPOINT: "http://localhost:3100"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://eshop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "order"
    expose:
      - "${ORDER_PORT}"
    depends_on:
      redis:
        condition: "service_started"
      rabbitmq:
        condition: "service_started"
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  payment:
    image: "${PAYMENT_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${PAYMENT_PORT}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__paymentdb: "Host=postgres;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=paymentdb"
      PAYMENTDB_HOST: "postgres"
      PAYMENTDB_PORT: "5432"
      PAYMENTDB_USERNAME: "${POSTGRES_USER}"
      PAYMENTDB_PASSWORD: "${POSTGRES_PASSWORD}"
      PAYMENTDB_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/paymentdb"
      PAYMENTDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/paymentdb"
      PAYMENTDB_DATABASENAME: "paymentdb"
      JAEGER_OTLP_ENDPOINT: "http://localhost:4317"
      TEMPO_OTLP_ENDPOINT: "http://localhost:4319"
      LOKI_ENDPOINT: "http://localhost:3100"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://eshop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "payment"
    expose:
      - "${PAYMENT_PORT}"
    depends_on:
      redis:
        condition: "service_started"
      rabbitmq:
        condition: "service_started"
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  shipping:
    image: "${SHIPPING_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SHIPPING_PORT}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__shippingdb: "Host=postgres;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=shippingdb"
      SHIPPINGDB_HOST: "postgres"
      SHIPPINGDB_PORT: "5432"
      SHIPPINGDB_USERNAME: "${POSTGRES_USER}"
      SHIPPINGDB_PASSWORD: "${POSTGRES_PASSWORD}"
      SHIPPINGDB_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/shippingdb"
      SHIPPINGDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/shippingdb"
      SHIPPINGDB_DATABASENAME: "shippingdb"
      JAEGER_OTLP_ENDPOINT: "http://localhost:4317"
      TEMPO_OTLP_ENDPOINT: "http://localhost:4319"
      LOKI_ENDPOINT: "http://localhost:3100"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://eshop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "shipping"
    expose:
      - "${SHIPPING_PORT}"
    depends_on:
      redis:
        condition: "service_started"
      rabbitmq:
        condition: "service_started"
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  apigateway:
    image: "${APIGATEWAY_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${APIGATEWAY_PORT}"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__authdb: "Host=postgres;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=authdb"
      AUTHDB_HOST: "postgres"
      AUTHDB_PORT: "5432"
      AUTHDB_USERNAME: "${POSTGRES_USER}"
      AUTHDB_PASSWORD: "${POSTGRES_PASSWORD}"
      AUTHDB_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/authdb"
      AUTHDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/authdb"
      AUTHDB_DATABASENAME: "authdb"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      CATALOG_HTTP: "http://catalog:${CATALOG_PORT}"
      services__catalog__http__0: "http://catalog:${CATALOG_PORT}"
      CATALOG_HTTPS: "https://catalog:${CATALOG_PORT}"
      INVENTORY_HTTP: "http://inventory:${INVENTORY_PORT}"
      services__inventory__http__0: "http://inventory:${INVENTORY_PORT}"
      INVENTORY_HTTPS: "https://inventory:${INVENTORY_PORT}"
      ORDER_HTTP: "http://order:${ORDER_PORT}"
      services__order__http__0: "http://order:${ORDER_PORT}"
      ORDER_HTTPS: "https://order:${ORDER_PORT}"
      PAYMENT_HTTP: "http://payment:${PAYMENT_PORT}"
      services__payment__http__0: "http://payment:${PAYMENT_PORT}"
      PAYMENT_HTTPS: "https://payment:${PAYMENT_PORT}"
      SHIPPING_HTTP: "http://shipping:${SHIPPING_PORT}"
      services__shipping__http__0: "http://shipping:${SHIPPING_PORT}"
      SHIPPING_HTTPS: "https://shipping:${SHIPPING_PORT}"
      JAEGER_OTLP_ENDPOINT: "http://localhost:4317"
      TEMPO_OTLP_ENDPOINT: "http://localhost:4319"
      LOKI_ENDPOINT: "http://localhost:3100"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://eshop-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "apigateway"
    expose:
      - "${APIGATEWAY_PORT}"
    depends_on:
      rabbitmq:
        condition: "service_started"
      postgres:
        condition: "service_started"
      redis:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
